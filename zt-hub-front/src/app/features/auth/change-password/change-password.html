<form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
  <div class="field">
    <label class="field-label">MOT DE PASSE ACTUEL</label>
    <div class="input-wrap pw-wrap">
      <i class="pi pi-lock field-icon"></i>
      <p-password formControlName="current" [feedback]="false" [toggleMask]="true" styleClass="pw-style" inputStyleClass="field-input pw-input" />
    </div>
  </div>
  <div class="field">
    <label class="field-label">NOUVEAU MOT DE PASSE</label>
    <div class="input-wrap pw-wrap">
      <i class="pi pi-lock field-icon"></i>
      <p-password formControlName="newPassword" [toggleMask]="true" styleClass="pw-style" inputStyleClass="field-input pw-input" />
    </div>
  </div>
  <div class="field">
    <label class="field-label">CONFIRMER LE MOT DE PASSE</label>
    <div class="input-wrap pw-wrap">
      <i class="pi pi-lock field-icon"></i>
      <p-password formControlName="confirm" [feedback]="false" [toggleMask]="true" styleClass="pw-style" inputStyleClass="field-input pw-input" />
    </div>
  </div>
  <button type="submit" class="submit-btn" [disabled]="loading">
    @if (loading) {
      <span><i class="pi pi-spin pi-spinner"></i> Enregistrement...</span>
    } @else {
      <span>Enregistrer</span>
    }
  </button>
</form>
