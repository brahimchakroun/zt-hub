@if (!sent) {
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
    <div class="field">
      <label class="field-label">Email</label>
      <div class="input-wrap">
        <i class="pi pi-envelope field-icon"></i>
        <input pInputText type="email" formControlName="email" class="field-input" placeholder="Entrez votre adresse e-mail" />
      </div>
    </div>
    <button type="submit" class="submit-btn" [disabled]="loading">
      @if (loading) {
        <span><i class="pi pi-spin pi-spinner"></i> Envoi...</span>
      } @else {
        <span>Envoyer</span>
      }
    </button>
  </form>
} @else {
  <div class="success-box">
    <i class="pi pi-check-circle"></i>
    <p>Un email a été envoyé (simulation).</p>
  </div>
}
<p class="footer-link"><a routerLink="/auth/login">Retour à la connexion</a></p>
